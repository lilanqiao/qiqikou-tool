# 在 GitHub 的云端机器上打包：Windows 版 + Mac 版（Apple 芯片 / Intel），
# 全部通过自检后，自动更新到仓库的 Releases（发布页）。
# 触发：推送代码，或在仓库 Actions 页面手动点 "Run workflow"。
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  VERSION: "2.0"

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple 芯片（M1/M2/M3/M4）
            arch: AppleSilicon
          - runner: macos-15-intel    # Intel 芯片的老款 Mac
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装依赖
        run: pip install numpy onnxruntime soundfile soxr tkinterdnd2 pyinstaller
      - name: 打包
        run: pyinstaller --noconfirm qiqikou.spec
      - name: 自检（用系统自带的中文语音合成一段测试音频，跑一遍处理）
        run: |
          say -v Tingting -o test.aiff "大家好，今天给大家介绍一个小工具。它可以自动去掉口播里的换气声，还能把太长的停顿剪短。" || say -o test.aiff "Hello, this is a test of the breath removal tool. It trims long pauses."
          afconvert -f WAVE -d LEI16@22050 test.aiff test.wav
          "dist/去气口工具.app/Contents/MacOS/去气口工具" --selftest "$PWD/test.wav" "$PWD/selftest_out"
          cat selftest_out/selftest.log
          grep -q "RESULT OK" selftest_out/selftest.log
      - name: 做成 DMG 安装包
        run: |
          mkdir -p dmg && cp -R "dist/去气口工具.app" dmg/
          ln -s /Applications dmg/Applications
          cp 使用说明_Mac.txt dmg/使用说明.txt
          cp 第三方开源许可.txt dmg/
          # 云端 Mac 偶发 "Resource busy"，重试几次
          for i in 1 2 3 4 5; do
            hdiutil create -volname "去气口工具" -srcfolder dmg -ov -format UDZO "QiQiKou-Mac-${{ matrix.arch }}.dmg" && break
            [ $i = 5 ] && exit 1; echo "第 $i 次失败，稍后重试"; sleep $((i * 5))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: 去气口工具_Mac版_${{ matrix.arch }}
          path: "*.dmg"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 装依赖
        run: pip install numpy onnxruntime soundfile soxr tkinterdnd2 pyinstaller
      - name: 打包
        run: pyinstaller --noconfirm qiqikou.spec
      - name: 自检（用 Windows 自带的语音合成一段测试音频，跑一遍处理）
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$PWD\test.wav")
          $s.Speak("Hello, this is a test of the breath removal tool. It trims long pauses between sentences.")
          $s.Dispose()
          $p = Start-Process -FilePath "dist\去气口工具\去气口工具.exe" -ArgumentList "--selftest","$PWD\test.wav","$PWD\selftest_out" -Wait -PassThru
          Get-Content selftest_out\selftest.log -Encoding UTF8
          if (-not (Select-String -Path selftest_out\selftest.log -Pattern "RESULT OK" -Quiet)) { exit 1 }
      - name: 做成 zip
        shell: pwsh
        run: |
          Copy-Item 使用说明_Windows.txt dist\去气口工具\使用说明.txt
          Copy-Item 第三方开源许可.txt dist\去气口工具\
          Compress-Archive -Path dist\去气口工具 -DestinationPath "QiQiKou-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: 去气口工具_Windows版
          path: "*.zip"

  release:
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: 更新发布页
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: 去气口工具 v${{ env.VERSION }}
          files: out/*
          make_latest: true
          body: |
            口播配音自动去换气、剪长停顿。下载对应系统的安装包：
            - **Windows 10/11**：`QiQiKou-Windows.zip`，解压后双击 `去气口工具.exe`
            - **Mac（Apple M 系列芯片）**：`QiQiKou-Mac-AppleSilicon.dmg`
            - **Mac（Intel 芯片）**：`QiQiKou-Mac-Intel.dmg`
            第一次打开的安全提示怎么处理，见安装包里的「使用说明」。

  # ── 发布后，在全新的云端机器上原样跑一遍给用户的一键安装命令 ──
  install-test-mac:
    needs: release
    runs-on: macos-14
    steps:
      - name: 一键安装（和用户在终端里粘贴的命令一样）
        run: curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.sh" | bash
      - name: 检查装好了、没有被拦截、能处理音频
        run: |
          APP="/Applications/去气口工具.app"
          test -d "$APP"
          if xattr -r "$APP" | grep -q com.apple.quarantine; then echo "还带着隔离标记"; exit 1; fi
          ls ~/Downloads | grep -i qiqikou && { echo "不该在下载目录留下安装包"; exit 1; } || true
          say -v Tingting -o t.aiff "大家好，今天给大家介绍一个小工具。它可以自动去掉口播里的换气声。" || say -o t.aiff "Hello, this is a test."
          afconvert -f WAVE -d LEI16@22050 t.aiff t.wav
          "$APP/Contents/MacOS/去气口工具" --selftest "$PWD/t.wav" "$PWD/out"
          cat out/selftest.log; grep -q "RESULT OK" out/selftest.log

  install-test-windows:
    needs: release
    runs-on: windows-latest
    steps:
      - name: 一键安装（Windows 自带的 PowerShell 5.1，和用户粘贴的命令一样）
        shell: powershell
        run: irm "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1" | iex
      - name: 检查装好了、有快捷方式、能处理音频
        shell: powershell
        run: |
          $dest = Join-Path $env:LOCALAPPDATA "Programs\QiQiKou"
          $exe = Get-ChildItem $dest -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "not installed" }
          # Shell.Application 读快捷方式是 Unicode 的；WScript.Shell 在英文系统上会把中文读成 ?
          $desk = [Environment]::GetFolderPath('Desktop')
          $targets = (New-Object -ComObject Shell.Application).NameSpace($desk).Items() | Where-Object { $_.IsLink } | ForEach-Object { $_.GetLink.Path }
          "desktop links -> $($targets -join ' | ')"
          if ($targets -notcontains $exe.FullName) { throw "no desktop shortcut pointing to $($exe.FullName)" }
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$PWD\t.wav"); $s.Speak("Hello, this is a test of the breath removal tool."); $s.Dispose()
          Start-Process -FilePath $exe.FullName -ArgumentList "--selftest","$PWD\t.wav","$PWD\out" -Wait
          Get-Content out\selftest.log -Encoding UTF8
          if (-not (Select-String -Path out\selftest.log -Pattern "RESULT OK" -Quiet)) { exit 1 }
